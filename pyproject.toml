[project]
name = "pace"
version = "0.1.0"
description = "PACE specification, reference types, validators, and TLA+ model for principal accessibility in agent networks"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ravi Kiran Kadaboina" }]
dependencies = [
    "pydantic>=2.14",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[project.scripts]
pace-mcp = "pace.mcp_server.server:main"

[project.urls]
Homepage = "https://ravikiran438.github.io/agent-protocol-stack/protocols/sauvidya/"
Paper = "https://doi.org/10.5281/zenodo.19633138"
Repository = "https://github.com/ravikiran438/sauvidya-pace"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
