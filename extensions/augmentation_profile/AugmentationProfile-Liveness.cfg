\* TLC configuration for the AUG-6 liveness property NudgeDue: an
\* expired step-up leads to a nudge or to the step-up ending. Liveness
\* checking keeps the whole state graph in memory, so the model is
\* smaller than AugmentationProfile.cfg.
\* Last run: 6,606 distinct states, no errors.
SPECIFICATION Spec

CONSTANTS
    Principals = {p1}
    AxisNames = {social_interpretation}
    Triggers = {medical_keyword}
    Tasks = {task1}
    MaxActions = 2

INVARIANTS
    TypeOK
    StepUpRespected
    StepUpClosesWithTask
    StepUpScope

PROPERTIES
    NudgeDue
