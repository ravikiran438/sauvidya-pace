\* TLC configuration for the augmentation-profile safety invariants
\* (AUG-1..AUG-6). 1 principal, 2 axes, 1 trigger, 1 task, up to 4
\* recorded actions. Principals share no state in this model, so one
\* principal covers the per-principal rules.
\* Last run: 4,048,527 distinct states, no errors (under a minute on 4 cores).
SPECIFICATION Spec

CONSTANTS
    Principals = {p1}
    AxisNames = {social_interpretation, independent_email}
    Triggers = {medical_keyword}
    Tasks = {task1}
    MaxActions = 4

INVARIANTS
    TypeOK
    Reversibility
    AuditDecomposition
    IdentityPreservation
    SkillMaintenance
    EmergencyBoundary
    StepUpRespected
    StepUpClosesWithTask
    StepUpScope
