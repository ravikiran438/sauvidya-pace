\* TLC configuration for Pace.tla

\* Minimal model: 1 principal, 1 orchestrator, 2 versions.
\* V-3 is enforced structurally by the ApplyViolationNotice action's
\* version-match guard, not as a state invariant — so we don't need
\* multiple orchestrators to verify it. Standard small-model TLA+
\* practice; matches AWS-published patterns (DynamoDB, S3 papers).
CONSTANTS
    Principals = {p1}
    Agents = {a1, a2}
    Orchestrators = {a1}
    TimeSlots = {t_morning, t_afternoon}
    AllTimes = {t_morning, t_afternoon, t_evening, t_night}
    MaxOptionsPerTurn = 2
    CapacityThreshold = 70
    AicVersions = {v1, v2}

SPECIFICATION Spec

INVARIANTS
    Invariants
