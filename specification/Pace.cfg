\* TLC configuration for Pace.tla: small model, fast (well under a second).
\*
\* 1 principal, 2 agents, 1 orchestrator, 2 AIC versions,
\* 2 valid time slots out of 4.
\* Last run: 40,760 distinct states, no errors.
\*
\* With a single orchestrator the issuer and receiver of a
\* PACEViolationNotice are the same party. Pace-CrossOrchestrator.cfg
\* checks the same invariants with two orchestrators.
CONSTANTS
    Principals = {p1}
    Agents = {a1, a2}
    Orchestrators = {a1}
    TimeSlots = {t_morning, t_afternoon}
    AllTimes = {t_morning, t_afternoon, t_evening, t_night}
    MaxOptionsPerTurn = 2
    CapacityThreshold = 70
    AicVersions = {v1, v2}

SPECIFICATION Spec

INVARIANTS
    Invariants
