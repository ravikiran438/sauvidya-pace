\* TLC configuration for Pace.tla: two orchestrators.
\*
\* Both agents act as orchestrators, so violation notices travel
\* between distinct parties and V-1 block enforcement is exercised
\* across orchestrators bound to the same or different AIC versions.
\* 1 principal, 2 agents, 2 orchestrators, 2 AIC versions.
\* Last run: 8,249,080 distinct states, no errors
\* (about 2 minutes on 4 cores).
CONSTANTS
    Principals = {p1}
    Agents = {a1, a2}
    Orchestrators = {a1, a2}
    TimeSlots = {t_morning, t_afternoon}
    AllTimes = {t_morning, t_afternoon, t_evening, t_night}
    MaxOptionsPerTurn = 2
    CapacityThreshold = 70
    AicVersions = {v1, v2}

SPECIFICATION Spec

INVARIANTS
    Invariants
