name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests, manifests, MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install (Python from .python-version, deps from uv.lock)
        run: uv sync --locked --all-extras
      - name: Tests
        run: uv run pytest
      - name: Manifests match the code
        run: uv run python -m pace.manifest --check
      - name: MCP server self-check
        run: uv run pace-mcp --doctor
      - name: Every contract field has a reader; every paper field exists
        run: uv run python scripts/contract-readers.py

  models:
    name: TLA+ models, witnesses, mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Model checks
        run: scripts/check-models.sh core augmentation witnesses mutants

  cross-orchestrator:
    name: TLA+ cross-orchestrator model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Two-orchestrator model (about 2 minutes)
        run: scripts/check-models.sh cross
